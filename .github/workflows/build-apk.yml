name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu-latest runner already ships a full Android SDK
      # (cmdline-tools, platforms, build-tools) -- android-actions/setup-android@v3
      # is not needed and currently fails trying to install the removed
      # legacy "tools" package. Just accept the SDK licenses so Gradle's
      # own auto-download of any missing platform/build-tools (if any)
      # doesn't get blocked on an interactive prompt.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfs-sms-relay-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Build and release signed APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/app/release.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -PMFS_RELEASE_STORE_FILE="release.keystore" \
            -PMFS_RELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PMFS_RELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PMFS_RELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ github.workspace }}/app/release.keystore"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfs-sms-relay-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
