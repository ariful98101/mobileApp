plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

// --- Release signing configuration -----------------------------------------
// The CI workflow (.github/workflows/build-apk.yml) decodes a base64-encoded
// keystore from the KEYSTORE_BASE64 secret into app/release.keystore and
// passes the following as -P Gradle properties:
//   MFS_RELEASE_STORE_FILE, MFS_RELEASE_STORE_PASSWORD,
//   MFS_RELEASE_KEY_ALIAS, MFS_RELEASE_KEY_PASSWORD
// For a plain local debug build none of this is required - the release
// signingConfig simply falls back to the debug key so `assembleRelease`
// still works locally (producing a debug-signed, non-distributable APK)
// even without secrets configured. See README.md for how to generate a
// real release keystore.
def releaseStoreFile = project.hasProperty('MFS_RELEASE_STORE_FILE') ? project.property('MFS_RELEASE_STORE_FILE') : null
def releaseStorePassword = project.hasProperty('MFS_RELEASE_STORE_PASSWORD') ? project.property('MFS_RELEASE_STORE_PASSWORD') : null
def releaseKeyAlias = project.hasProperty('MFS_RELEASE_KEY_ALIAS') ? project.property('MFS_RELEASE_KEY_ALIAS') : null
def releaseKeyPassword = project.hasProperty('MFS_RELEASE_KEY_PASSWORD') ? project.property('MFS_RELEASE_KEY_PASSWORD') : null
def hasReleaseSigningProps = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.mfsrelay.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mfsrelay.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigningProps) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigningProps ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    // Core / Compose
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // DataStore (Preferences) for settings
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Accompanist (pull-to-refresh / permissions helper is hand-rolled, but swipe refresh is useful)
    implementation 'androidx.compose.material:material:1.6.8'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
